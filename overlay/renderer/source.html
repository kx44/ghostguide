<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; media-src file:; img-src file:">
<title>GhostGuide: source</title>
<style>
  :root { --bg:#17151D; --fg:#FFFFFF; --mute:rgba(255,255,255,.62); --line:rgba(255,255,255,.28); --acc:#C4B5FD; --on-acc:#17151D; --warn:#FDBA74; --field:#221F2B; --mark:rgba(196,181,253,.14); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px 14px 8px; border-bottom:1px solid rgba(255,255,255,.12); flex:none; }
  header .meta { color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header b { display:block; font-size:14px; font-weight:500; }
  header .where { color:var(--acc); font-size:12px; }
  #video, #text, #none { flex:1; min-height:0; }
  #video { display:flex; flex-direction:column; background:#000; }
  video { flex:1; min-height:0; width:100%; background:#000; outline:none; }
  #text { overflow-y:auto; padding:6px 16px 40px; }
  #text h2 { font-size:15px; font-weight:500; margin:18px 0 6px; }
  #text p { margin:0 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #text img { max-width:100%; display:block; margin:6px 0 10px; border-radius:6px; }
  #text .sec { padding:2px 10px; margin:0 -10px; border-left:2px solid transparent; border-radius:0 6px 6px 0; }
  #text .sec.here { background:var(--mark); border-left-color:var(--acc); }
  #none { padding:20px 16px; display:flex; flex-direction:column; gap:10px; }
  #note { padding:6px 14px; color:var(--warn); font-size:12px; flex:none; }
  footer { padding:8px 14px; display:flex; gap:8px; align-items:center; border-top:1px solid rgba(255,255,255,.12); flex:none; }
  footer .gap { flex:1; }
  button { font:inherit; font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--acc); }
  button.pri { background:var(--acc); color:var(--on-acc); border-color:var(--acc); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="meta" id="meta"></div>
  <b id="title"></b>
  <div class="where" id="where" hidden></div>
</header>
<div id="note" hidden></div>
<div id="video" hidden><video id="player" controls preload="auto"></video></div>
<div id="text" hidden></div>
<div id="none" hidden><div id="message"></div></div>
<footer>
  <button id="replay" hidden>Play this step again</button>
  <button id="link" hidden></button>
  <button id="choose" hidden></button>
  <span class="gap"></span>
  <button id="close">Close</button>
</footer>
<script src="sourceView.js"></script>
</body>
</html>
